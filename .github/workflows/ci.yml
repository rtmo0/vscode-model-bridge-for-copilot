name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies are bundled into the extension, so their advisories block the build.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      # Build tooling (vsce, esbuild, TypeScript) is not shipped; its advisories are reported without failing.
      - name: Audit build tooling
        run: npm audit || echo "::warning::npm audit reports advisories in build-only dependencies; see the log above."

      - name: Type-check and compile
        run: npm run compile

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Verify VSIX packaging
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-bridge-for-copilot-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
